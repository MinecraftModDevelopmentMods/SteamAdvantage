name: Steam Advantage 1.16 CI

on:
  push:
    branches: [master-1.16.5, 'feature/**']
  pull_request:
    branches: [master-1.16.5]

permissions:
  contents: read

concurrency:
  group: steamadvantage-1.16-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out SteamAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate final Power source pin
        shell: bash
        run: |
          set -euo pipefail
          power_ref=$(sed -n 's/^poweradvantage_source_ref=//p' gradle.properties | tr -d '\r')
          power_hash=$(sed -n 's/^poweradvantage_deobf_sha256=//p' gradle.properties | tr -d '\r')
          if [[ ! "$power_ref" =~ ^[a-f0-9]{40}$ || ! "$power_hash" =~ ^[A-F0-9]{64}$ ]]; then
            echo "::error::Final Power 1.16 dependency pin is pending."
            exit 1
          fi
          echo "POWERADVANTAGE_SOURCE_REF=$power_ref" >> "$GITHUB_ENV"
      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: a113e5d767169189f0e35ade1e173a12d550b00e
          path: .ci-dependencies/OreSpawn
      - name: Use canonical LF dependency inputs
        # Use the same source bytes on hosted and local dependency builds.
        run: git config --global core.autocrlf false
      - name: Check out pinned Base Metals
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/BaseMetals
          ref: 995f6cc4dd2d5eecc628a42e5c43fa5390c24bca
          path: .ci-dependencies/BaseMetals
      - name: Check out PowerAdvantage 1.16.5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/PowerAdvantage
          ref: 2116a35a40dd150d79e7dfdcdc891637793178b7
          path: .ci-dependencies/PowerAdvantage
      - name: Install pinned Java 25 Mavenizer runtime
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25.0.3+9.0.LTS'
      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'
      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17.0.1+12'
      - name: Use pinned build toolchains
        # These are Gradle project properties, not JVM system properties.
        shell: bash
        run: >-
          echo "MMD_GRADLE_TOOLCHAINS=-Porg.gradle.java.installations.paths=$JAVA_HOME,$JAVA_HOME_8_X64,$JAVA_HOME_25_X64
          -Porg.gradle.java.installations.auto-detect=false
          -Porg.gradle.java.installations.auto-download=false" >> "$GITHUB_ENV"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
      - name: Build 1.16.5 dependency chain
        id: dependencies
        shell: bash
        run: |
          set -euo pipefail
          orespawn="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          basemetals="$GITHUB_WORKSPACE/.ci-dependencies/BaseMetals"
          power="$GITHUB_WORKSPACE/.ci-dependencies/PowerAdvantage"
          chmod +x "$orespawn/gradlew" "$basemetals/gradlew" "$power/gradlew"
          (cd "$orespawn" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar --no-daemon --stacktrace)
          (cd "$basemetals" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar --no-daemon --stacktrace)
          osjar="$orespawn/build/libs-dev/OreSpawn-4.1.0.116051-deobf.jar"
          bmjar="$basemetals/build/libs-dev/BaseMetals-3.1.1.116051-deobf.jar"
          (cd "$power" && ./gradlew $MMD_GRADLE_TOOLCHAINS jar verifyReleaseDependencies \
            -PbaseMetalsDeobfJar="$bmjar" -PoreSpawnDeobfJar="$osjar" \
            --no-daemon --stacktrace)
          powerjar="$power/build/libs-dev/PowerAdvantage-2.4.7.116051-deobf.jar"
          test -f "$osjar" && test -f "$bmjar" && test -f "$powerjar"
          echo "orespawn=$osjar" >> "$GITHUB_OUTPUT"
          echo "basemetals=$bmjar" >> "$GITHUB_OUTPUT"
          echo "power=$powerjar" >> "$GITHUB_OUTPUT"
          echo "power_ref=$(git -C "$power" rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Build and audit release artifacts
        run: >-
          ./gradlew $MMD_GRADLE_TOOLCHAINS clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts
          writeReleaseChecksums verifyEclipseProductionClasspath
          -PpowerAdvantageDeobfJar=${{ steps.dependencies.outputs.power }}
          -Ppoweradvantage_source_ref=${{ steps.dependencies.outputs.power_ref }}
          -PbaseMetalsDeobfJar=${{ steps.dependencies.outputs.basemetals }}
          -PoreSpawnDeobfJar=${{ steps.dependencies.outputs.orespawn }}
          --no-daemon --stacktrace
      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SteamAdvantage-1.16.5-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SteamAdvantage-2.2.8.116051.jar
            build/libs/SteamAdvantage-2.2.8.116051-sources.jar
            build/libs/SteamAdvantage-2.2.8.116051-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt
      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SteamAdvantage-1.16.5-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
            .ci-dependencies/PowerAdvantage/build/reports/**
            .ci-dependencies/PowerAdvantage/build/libs-dev/*.jar
