name: Steam Advantage 1.10 CI

on:
  push:
    branches:
      - master-1.10.2
      - 'feature/**'
  pull_request:
    branches:
      - master-1.10.2

permissions:
  contents: read

concurrency:
  group: steamadvantage-1.10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, test, and audit
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
      - name: Check out SteamAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check out pinned OreSpawn
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/OreSpawn
          ref: 5a50df1158e948c8db55814e819090b34c12d765
          path: .ci-dependencies/OreSpawn

      - name: Check out pinned PowerAdvantage
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: MinecraftModDevelopmentMods/PowerAdvantage
          ref: 2443eaae7c666b8d54a5c9c30091892b79e80994
          path: .ci-dependencies/PowerAdvantage

      - name: Install Java 8 toolchain
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '8.0.502+7'

      - name: Install Java 17 for Gradle
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: microsoft
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6

      - name: Build pinned OreSpawn development jar
        id: orespawn
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.ci-dependencies/OreSpawn"
          chmod +x "$dependency/gradlew"
          (
            cd "$dependency"
            ./gradlew deobfJar --no-daemon --stacktrace
          )
          jar="$dependency/build/libs-dev/OreSpawn-4.0.8.110021-deobf.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Build pinned PowerAdvantage development jar
        id: poweradvantage
        shell: bash
        run: |
          set -euo pipefail
          dependency="$GITHUB_WORKSPACE/.ci-dependencies/PowerAdvantage"
          mirror="$RUNNER_TEMP/reborncore-mirror"
          chmod +x "$dependency/gradlew"
          (
            cd "$dependency"
            bash gradle/stage-reborncore-release.sh "$mirror"
            ./gradlew deobfJar verifyReleaseDependencies \
              -PrebornCoreVerificationRepository="$mirror" \
              -PoreSpawnDeobfJar="${{ steps.orespawn.outputs.jar }}" \
              --no-daemon --stacktrace
          )
          jar="$dependency/build/libs-dev/PowerAdvantage-2.4.3.110021-deobf.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"

      - name: Make the wrapper executable
        run: chmod +x ./gradlew

      - name: Build and audit release artifacts
        run: >-
          ./gradlew clean check build javadoc verifyReleaseDependencies verifyReleaseArtifacts
          writeReleaseChecksums verifyEclipseProductionClasspath
          -PpowerAdvantageDeobfJar=${{ steps.poweradvantage.outputs.jar }}
          -PoreSpawnDeobfJar=${{ steps.orespawn.outputs.jar }}
          --no-daemon --stacktrace

      - name: Upload audited release candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SteamAdvantage-1.10.2-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            build/libs/SteamAdvantage-2.2.5.110021.jar
            build/libs/SteamAdvantage-2.2.5.110021-sources.jar
            build/libs/SteamAdvantage-2.2.5.110021-javadoc.jar
            build/release/SHA256SUMS
            CHANGELOG.txt

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: SteamAdvantage-1.10.2-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            build/test-results/**
            build/reports/**
            build/*-run/logs/**
            build/problems/**
            .ci-dependencies/OreSpawn/build/reports/**
            .ci-dependencies/PowerAdvantage/build/reports/**
